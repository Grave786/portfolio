<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="200" height="200" fill="white"/>

  <!-- Binary Numbers -->
  <text x="10" y="20" font-size="10" fill="#d0d0d0" font-family="monospace">1010</text>
  <text x="150" y="40" font-size="10" fill="#d0d0d0" font-family="monospace">0110</text>
  <text x="60" y="150" font-size="10" fill="#d0d0d0" font-family="monospace">1101</text>

  <!-- Code Snippets -->
  <text x="20" y="80" font-size="10" fill="#b0b0b0" font-family="monospace">&lt;div&gt;</text>
  <text x="100" y="120" font-size="10" fill="#b0b0b0" font-family="monospace">function()</text>

  <!-- Brackets -->
  <text x="170" y="90" font-size="16" fill="#e0e0e0" font-family="monospace">{}</text>
  <text x="50" y="40" font-size="16" fill="#e0e0e0" font-family="monospace">[]</text>

  <!-- Circuit Lines -->
  <path d="M30 30 H60 V60 H90" stroke="#e8e8e8" stroke-width="1"/>
  <path d="M120 10 V40 H180" stroke="#f0f0f0" stroke-width="1"/>
  <circle cx="60" cy="60" r="2" fill="#d0d0d0"/>
  <circle cx="90" cy="60" r="2" fill="#d0d0d0"/>
  <circle cx="120" cy="40" r="2" fill="#d0d0d0"/>

  <!-- Subtle Dotted Grid (light texture) -->
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#f2f2f2"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#dots)" />
</svg>
